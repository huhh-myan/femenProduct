<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    @font-face {
      font-family: "Montserrat";
      src: url('./fonts/Montserrat/Montserrat-VariableFont_wght.ttf');
    }
    @font-face {
      font-family: "Fraunces";
      src: url('./fonts/Fraunces/Fraunces-VariableFont_SOFT\,WONK\,opsz\,wght.ttf')
    }
    *,
    *::before,
    *::after{
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 0;
      margin: 0;
      background-color: hsl(30, 38%, 92%);
    }
    main {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    main > div {
      width: min(100% - 2rem, 600px);
      background-color: white;
      display: flex;
      justify-content: center;
      border-radius: 10px;
      overflow: hidden;
    }
    div picture  {
      flex: 1;
      display: block;
    }
    main > div > div {
      flex:1;
      display: flex;
      flex-direction: column;
      gap:1.5rem;
      padding: 2rem;
    }

    .main-image{
      display: block; 
      width: 100%;
      height: 100%;
      object-fit: cover;
    }




    div h1{
      margin: 0;
      font-family: "Fraunces";
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }
    div p{
      margin: 0;
      font-family: "Montserrat";
      font-size: 0.875rem;
      font-weight: 500;
      color: hsl(228, 12%, 48%);
      line-height: 1.6;
    }
    button {
      border: 0 ;
      border-radius: 8px;
      height: 3rem;
      background-color: hsl(158, 36%, 37%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: "Montserrat";
      font-size: 0.875rem;
      font-weight: 700;
    }
    button img {
      height: 16px;
    }


    .div__product-name{
      color: hsl(228, 12%, 48%);
      letter-spacing: 0.3em;
      font-family: "Montserrat";
      font-size: 0.75rem;
      font-weight: 500;
    }
    .div__discount-price {
      color: hsl(158, 36%, 37%);
      font-family: "Fraunces";
      font-size: xx-large;
      font-weight: 700;
    }
    .div__original-price{
      color: hsl(228, 12%, 48%);
      font-family: "Montserrat";
      font-size: small;
      margin-inline-start: 1.5rem;
      font-weight: 500;
      vertical-align: middle;
      text-decoration: line-through;
    }



    @media(max-width:600px){
      div{
        flex-direction: column;
      }
      div div {
        gap:1rem;
        padding: 1.5rem;
      }

      .main-image{
        width: 100%;
        height: auto;
      }
    }
    
  </style>
</head>
<body>

  <main >
  <div>

    <picture>
      <source media="(max-width: 600px)" srcset="./images/image-product-mobile.jpg" />
      <img src="./images/image-product-desktop.jpg" alt="" class="main-image"/>
    </picture>
    
    <div>
      <span class="div__product-name">PERFUME</span>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>

      
      <span class="div__discount-price">$149.99<span class="div__original-price">$169.99</span></span>


      <button><img src="./images/icon-cart.svg"/> Add to Cart</button>
    </div>

  </div>
  </main>

</body>
</html>
