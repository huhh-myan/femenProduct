<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    @font-face {
      font-family: "Montserrat";
      src: url('./fonts/Montserrat/Montserrat-VariableFont_wght.ttf');
    }
    @font-face {
      font-family: "Fraunces";
      src: url('./fonts/Fraunces/Fraunces-VariableFont_SOFT\,WONK\,opsz\,wght.ttf')
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 0;
      margin: 0;
      background-color: hsl(30, 38%, 92%);
    }

    .page {
      min-height: 100vh;
      padding-block: 1.75rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .product-card {
      width: min(100% - 2rem, 600px);
      background-color: white;
      display: flex;
      border-radius: 10px;
      overflow: hidden;
    }

    .product-card__picture {
      flex: 0 0 50%;
      display: block;
    }
    .product-card__image{
      display: block; 
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-card__content{
      flex:1;
      display: flex;
      flex-direction: column;
      gap:1.5rem;
      padding: 2rem;
    }
    .product-card__category {
      color: hsl(228, 12%, 48%);
      letter-spacing: 0.3em;
      font-family: "Montserrat";
      font-size: 0.75rem;
      font-weight: 500;
    }
    .product-card__title {
      margin: 0;
      font-family: "Fraunces";
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }
    .product-card__description{
      margin: 0;
      font-family: "Montserrat";
      font-size: 0.875rem;
      font-weight: 500;
      color: hsl(228, 12%, 48%);
      line-height: 1.6;
    }

    .product-card__price-row {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }
    .product-card__sale-price {
      color: hsl(158, 36%, 37%);
      font-family: "Fraunces";
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }
    .product-card__original-price{
      color: hsl(228, 12%, 48%);
      font-family: "Montserrat";
      font-size: 0.8125rem;
      font-weight: 500;
      text-decoration: line-through;
    }

    .product-card__button {
      border: 0 ;
      border-radius: 8px;
      height: 3rem;
      background-color: hsl(158, 36%, 37%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.875rem;
      font-family: "Montserrat";
      font-size: 0.875rem;
      font-weight: 700;
    }
    .product-card__button-icon {
      height: 1rem;
    }
    .product-card__button:hover,
    .product-card__button:focus-visible{
      background-color: hsl(158, 42%, 18%);
      cursor: pointer;
    }

    @media(max-width:600px){
      .product-card {
        flex-direction: column;
      }
      .product-card__image {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="page">
  <article class="product-card">
    <picture class="product-card__picture">
      <source media="(max-width: 600px)" srcset="./images/image-product-mobile.jpg" />
      <img src="./images/image-product-desktop.jpg" alt="" class="product-card__image"/>
    </picture>
    
    <div class="product-card__content">
      <span class="product-card__category">PERFUME</span>

      <h1 class="product-card__title">Gabrielle Essence Eau De Parfum</h1>

      <p class="product-card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>

      <div class="product-card__price-row">
        <span class="product-card__sale-price">$149.99</span>
        <span class="product-card__original-price">$169.99</span>
      </div>

      <button class="product-card__button"><img src="./images/icon-cart.svg" class="product-card__button-icon"/> Add to Cart</button>
    </div>
  </article>
  </main>
</body>
</html>
